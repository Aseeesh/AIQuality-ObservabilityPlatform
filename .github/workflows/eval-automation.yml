# Eval Automation — scheduled offline evaluation runs against the demo/calibration sets.
# Runs the calibrated LLM-as-Judge evaluator and publishes the report. The pass-rate gate is
# advisory here (the offline heuristic backend is intentionally conservative); correctness of
# the evaluator itself is gated by the unit suites in quality-ci.
name: eval-automation
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  evaluate:
    name: run evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run evaluation (report to step summary)
        run: |
          cd python-services/quality-evaluator
          python -m evaluator.runner > report.json 2> summary.md || \
            echo "::warning::evaluation pass-rate below gate (offline heuristic backend)"
          {
            echo '### Evaluation report'
            echo '```json'
            cat report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: python-services/quality-evaluator/report.json
