# Dev overlay: development env + a Vite dev server with hot reload for the frontend.
# Usage: docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up
name: aiquality
services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  # Replace the nginx-served bundle with the Vite dev server (HMR).
  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host --port 5173"
    environment:
      VITE_API_BASE: http://localhost:8080
    volumes: ["../frontend/quality-platform:/app"]
    ports: ["5173:5173"]
