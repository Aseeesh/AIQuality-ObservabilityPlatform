# Production overlay: restart policies + production env. Still builds from source (swap the
# `build:` blocks for pre-pushed `image:` refs once you publish to a registry).
# Usage: docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
name: aiquality
services:
  api:
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production

  frontend:
    restart: unless-stopped

  quality-evaluator:
    restart: unless-stopped

  anomaly-detector:
    restart: unless-stopped

  automated-rca:
    restart: unless-stopped

  feedback-processor:
    restart: unless-stopped
