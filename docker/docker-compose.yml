# Base compose stack: shared infrastructure + core services.
# Overlay with docker-compose.dev.yml or docker-compose.prod.yml.
name: aiquality
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiquality}
      POSTGRES_USER: ${POSTGRES_USER:-aiquality}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiquality}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]

  prometheus:
    image: prom/prometheus:latest
    volumes: ["../config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]

  # Jaeger all-in-one: OTLP collector (4317/4318) + trace UI (16686).
  jaeger:
    image: jaegertracing/all-in-one:1.62
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4317:4317", "4318:4318"]

  api:
    build: ../backend/AIQuality.API
    env_file: ../.env
    environment:
      # Export spans to the Jaeger OTLP/gRPC endpoint inside the compose network.
      OpenTelemetry__Endpoint: http://jaeger:4317
    depends_on: [postgres, redis, rabbitmq, jaeger]
    ports: ["8080:8080"]

volumes:
  pgdata:
